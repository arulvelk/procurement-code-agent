name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor the package claims, so it is tested rather than
        # assumed. 3.12 is what most people will actually run it on.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev,graph]"

      - name: Lint
        run: ruff check .

      - name: Types
        run: mypy

      # The suite stubs the ONNX models, so this step needs no network and
      # downloads no weights. That is the reason it finishes in seconds.
      - name: Tests
        run: pytest -q
