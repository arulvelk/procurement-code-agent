[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "procurement-code-agent"
version = "0.1.0"
description = "A typed MCP server, HTTP API and agent that classify free-text purchase descriptions into US federal procurement codes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Arulvel Kumarasamy" }]

dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "fastmcp>=2.3",
    "fastembed>=0.4",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
graph = ["langgraph>=0.2", "langchain-core>=0.3"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
pcagent-api = "pcagent.api:main"
pcagent-mcp = "pcagent.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pcagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["pcagent"]
mypy_path = "src"
